# AEGIS - Development Override
# Runs PostgreSQL only (Next.js runs via pnpm dev locally)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  # Disable the app service in development — use pnpm dev instead
  app:
    profiles:
      - production-only

  # MinIO/MailHog/the bucket-creation one-shot are only needed alongside the
  # containerized app (full stack / on-prem) — the postgres-only dev path
  # (pnpm dev) doesn't use them, so keep them off here too.
  minio:
    profiles:
      - production-only
  createbuckets:
    profiles:
      - production-only
  mailhog:
    profiles:
      - production-only

  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      # Relaxed password requirement for local dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev_password}
