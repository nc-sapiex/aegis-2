# AEGIS - local Docker Compose
# PostgreSQL 16 + the Next.js application, for running the stack on a developer
# machine. AEGIS is not deployed anywhere; this is not a production manifest.
#
# Usage (PostgreSQL only, app via `pnpm dev` — the normal path):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Usage (full stack in containers):
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_APP_URL is inlined into the image at build time (see the
      # Dockerfile's own comment on its ARG) — without this, every image
      # silently bakes in the Dockerfile's http://localhost:3000 default
      # regardless of .env, which then fails license host verification for
      # any real deployment (src/instrumentation.ts checks the license
      # against this baked-in value, not the runtime env var).
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: aegis-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_OWNER_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
      DATABASE_URL: postgresql://aegis_app:${DATABASE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      # db-bootstrap.ts (pnpm db:migrate) creates aegis_system with this
      # password — required even though env.ts marks it optional (that's for
      # the app's own runtime; the bootstrap script itself requires it).
      DATABASE_SYSTEM_PASSWORD: ${DATABASE_SYSTEM_PASSWORD:?DATABASE_SYSTEM_PASSWORD is required}
      DATABASE_SYSTEM_URL: postgresql://aegis_system:${DATABASE_SYSTEM_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-aegis-evidence-prod}
      # Object storage — s3/minio/disabled (src/env.ts). minio is the default
      # here because this compose file is the on-prem/full-stack path; a real
      # AWS deployment overrides STORAGE_DRIVER=s3 and drops S3_ENDPOINT.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-minio}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Mail — ses/smtp/disabled (src/env.ts). smtp+MailHog by default for
      # the same reason; production SES deployments override MAIL_DRIVER=ses.
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-mailhog}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-mailhog}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # License file — unset means no license check at boot (src/lib/license.ts).
      LICENSE_FILE_PATH: ${LICENSE_FILE_PATH:-}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: on this (Alpine/musl) image "localhost"
      # resolves ::1 first, but the Next server only binds 0.0.0.0 (IPv4) —
      # wget then gets connection refused even though the app is up. Matches
      # the Dockerfile's own HEALTHCHECK (127.0.0.1, /api/health), which this
      # overrides — compose's healthcheck wins over the image's when both
      # are set, so they need to agree.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # One-shot: runs `pnpm db:migrate` (prisma migrate deploy + db-bootstrap +
  # db-verify). Not `app` via `exec` — the runner stage (app's image) is the
  # minimal Next.js standalone output and has no pnpm/tsx/prisma CLI at all
  # (those are dev tooling, traced out of the production bundle). The
  # `builder` stage still has them, so this reuses that build target instead
  # of adding dev tooling to the image everyone else deploys. Also: app's own
  # boot (instrumentation.ts -> pg-boss) fails until aegis_app exists, so
  # migrations must run, and app must start, *before* `app` is asked to wait
  # healthy — see aegis-install.sh's three-step up/run/up.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: aegis-migrate
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_OWNER_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
      DATABASE_SYSTEM_PASSWORD: ${DATABASE_SYSTEM_PASSWORD:?DATABASE_SYSTEM_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    # Never started by `up` (with or without --wait) — only by
    # `docker compose run --rm migrate`, naming it explicitly.
    profiles:
      - tools

  minio:
    # Docker Hub's minio/minio was pulled by MinIO (licensing dispute,
    # confirmed by a failed pull as of this dispatch); quay.io/minio/minio is
    # the maintained image.
    image: quay.io/minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      # Defaults (not :?required) so the postgres-only dev path
      # (docker-compose.dev.yml, which doesn't start minio) still parses
      # without every operator setting these. Set real values in .env for
      # any flow that actually starts minio (full stack / on-prem).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: MinIO doesn't auto-create buckets. Creates S3_BUCKET_NAME after
  # minio is healthy, then exits. app's depends_on waits for this to
  # complete so the first upload doesn't race an empty bucket namespace.
  createbuckets:
    image: quay.io/minio/mc:latest
    container_name: aegis-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-aegis-evidence-prod}
    # -p is --ignore-existing (confirmed via `mc mb --help` against this
    # exact image, and empirically: running `mc mb -p` twice against the
    # same bucket exits 0 both times) — safe to re-run against an
    # already-provisioned stack. app's depends_on is a hard
    # service_completed_successfully, so this NOT being idempotent would
    # permanently block app from starting on every install after the first.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb -p local/\"$$S3_BUCKET_NAME\" &&
      exit 0
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: aegis-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
