# pnpm settings. These live here, not in the `pnpm` field of package.json:
# pnpm 10.34.5 (the version `packageManager` pins) no longer reads that field.
# It warns and exits 0 rather than failing, so settings left there are silently
# inert. See https://pnpm.io/settings

# Security pins for transitive dependencies. Each entry closes a published
# advisory that the direct dependency has not yet picked up. Do not drop one
# without checking the advisory is fixed upstream.
overrides:
  "minimatch@3": ">=3.1.4 <4"
  "minimatch@5": ">=5.1.8 <6"
  "minimatch@9": ">=9.0.7 <10"
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@2": ">=2.1.4 <3"
  "fast-xml-parser@5": ">=5.5.6 <6"
  "fast-uri@3": ">=3.1.5 <4"
  "rollup@4": ">=4.59.0 <5"
  "postcss@8": ">=8.5.18 <9"
  "nanoid@3": ">=3.3.18 <4"
  "hono@4": ">=4.12.25 <5"
  "@hono/node-server@1": ">=1.19.10 <2"
  "kysely": ">=0.28.17"
  "flatted@3": ">=3.4.2 <4"
  "picomatch@2": ">=2.3.2 <3"
  "picomatch@4": ">=4.0.4 <5"
  "lodash": ">=4.18.0"
  "defu": ">=6.1.5"
  "ws@8": ">=8.21.0 <9"
  "tmp": ">=0.2.6"
  "effect@3": ">=3.20.0 <4"
  "happy-dom": ">=20.8.9"
  "vite": ">=7.3.5 <8"
  "serialize-javascript": ">=7.0.3"
  "deepmerge-ts": ">=8.0.0"
  "browserslist@4": ">=4.28.7 <5"
  "mysql2@3": ">=3.22.0 <4"

# Only these packages may run install scripts.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@sentry/cli"
  - "@swc/core"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
