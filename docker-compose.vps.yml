# AEGIS - vps-control overlay (aegis.sapiex.tech)
# Same stack as docker-compose.onprem.yml, fronted by the Traefik instance
# Coolify already runs on vps-control (coolify-proxy) instead of exposing
# port 3000 on the host. No MailHog — point MAIL_DRIVER=smtp at a real relay.
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --wait
#
# Verified live 2026-09-16 against vps-control's actual Traefik config
# (`docker inspect coolify-proxy`, and multica-frontend-1's own labels as a
# working reference): network "coolify" and cert resolver "letsencrypt"
# were right; the entrypoint name was NOT — Coolify names its entrypoints
# "http"/"https", not Traefik's stock "web"/"websecure". The http router +
# redirect middleware below matches the pattern every other app on this
# box already uses.

services:
  postgres:
    restart: always
    # No host port — only `app` reaches it, over the compose network.
    ports: !reset []
    volumes:
      - ${BACKUP_HOST_PATH:-./backups}:/backups:ro

  app:
    restart: always
    ports: !reset []
    networks:
      - default
      - coolify
    volumes:
      - ./license.aegis:/app/license.aegis:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: "coolify"
      traefik.http.middlewares.aegis-https.redirectscheme.scheme: "https"
      traefik.http.routers.aegis-http.entrypoints: "http"
      traefik.http.routers.aegis-http.middlewares: "aegis-https"
      traefik.http.routers.aegis-http.rule: "Host(`aegis.sapiex.tech`)"
      traefik.http.routers.aegis.entrypoints: "https"
      traefik.http.routers.aegis.rule: "Host(`aegis.sapiex.tech`)"
      traefik.http.routers.aegis.tls.certresolver: "letsencrypt"
      traefik.http.services.aegis.loadbalancer.server.port: "3000"

  minio:
    restart: always
    # Console/API stay internal — the app reaches minio:9000 on the compose
    # network, nothing here is routed through Traefik.
    ports: !reset []

  mailhog:
    restart: always
    # Internal only, same reasoning as minio — a real SMTP relay replaces
    # this in .env (MAIL_DRIVER=smtp/SMTP_HOST=...), but the base compose
    # starts this service unconditionally, so its UI must stay off the host.
    ports: !reset []

networks:
  coolify:
    external: true
