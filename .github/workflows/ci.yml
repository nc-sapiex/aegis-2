name: CI

# Docs-only changes skip this workflow on main pushes; docs.yml checks generated
# reference docs. On PRs the workflow always runs and the `changes` job skips
# the rest: a skipped required check passes branch protection, a check that
# never reports blocks the merge forever.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/docs/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]

# Cancel stale PR runs; let every main run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Outputs code=false only for a PR touching nothing but the paths push ignores.
  # Jobs below fail open: if this job fails, its output is empty and they run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: diff
        name: Detect docs-only PR
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # HEAD is the PR merge commit; its first parent is the base tip.
          # A failed or empty diff must mean "run everything", not "docs-only".
          if ! files=$(git diff --name-only HEAD^1 HEAD) || [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" \
            | grep -qvE '^docs/|\.md$|^\.github/docs/|^\.github/dependabot\.yml$|^\.github/workflows/docs\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Check formatting
        run: pnpm exec prettier --check src

  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: pnpm tsc --noEmit

  # There is no separate `pnpm build` job: e2e-smoke runs `pnpm build` through
  # Playwright's webServer, and docker-build builds the production image.

  # Builds the actual production image, the way Coolify does on every merge.
  #
  # A plain `pnpm build` is NOT a substitute: it runs with the env vars supplied
  # inline, so it stays green even when the Dockerfile does not define them.
  # That is exactly how a broken image reached production — CI was green, the
  # deploy failed, and the site sat on the previous release.
  #
  # Deliberately passes NO build args, so the image is built purely from the
  # Dockerfile's own defaults. If a change makes the build depend on a value the
  # Dockerfile does not provide, this job fails here rather than at deploy time.
  docker-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm vitest run
        env:
          SKIP_ENV_VALIDATION: "1"

  integration-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432
    env:
      DATABASE_OWNER_URL: postgresql://test:testpassword@localhost:5432/aegis_integration
      DATABASE_URL: postgresql://aegis_app:ci-app-password-0123456789@localhost:5432/aegis_integration
      DATABASE_APP_PASSWORD: ci-app-password-0123456789
      DATABASE_SYSTEM_URL: postgresql://aegis_system:ci-system-password-0123456789@localhost:5432/aegis_integration
      DATABASE_SYSTEM_PASSWORD: ci-system-password-0123456789
      SKIP_ENV_VALIDATION: "1"
      BETTER_AUTH_SECRET: ci-integration-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run integration tests
        run: pnpm test:integration

  security-audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          prisma: "false"

      # A hard gate: a high or critical advisory against a production
      # dependency fails CI. This was advisory-only while the backlog was
      # non-empty; #59 cleared every high/critical, so the gate now reflects a
      # standard the codebase actually meets. Restoring continue-on-error to
      # get a red build green again would silently reopen that backlog — fix
      # or override the advisory instead.
      - name: Run security audit
        run: pnpm audit --prod --audit-level=high

  # Blocking browser subset, and the only browser gate on a merge. The full
  # suite runs nightly and on demand from e2e.yml — it is slow and has known
  # flaky scenarios. Do not add continue-on-error here.
  e2e-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    uses: ./.github/workflows/e2e.yml
    with:
      smoke: true
