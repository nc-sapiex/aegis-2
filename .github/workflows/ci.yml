name: CI

# Docs-only changes skip this workflow; docs.yml checks generated reference docs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/docs/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/docs/**"
      - ".github/dependabot.yml"
      - ".github/workflows/docs.yml"

# Cancel stale PR runs; let every main run finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run TypeScript type check
        run: pnpm tsc --noEmit

  # There is no separate `pnpm build` job: e2e-smoke runs `pnpm build` through
  # Playwright's webServer, and docker-build builds the production image.

  # Builds the actual production image, the way Coolify does on every merge.
  #
  # A plain `pnpm build` is NOT a substitute: it runs with the env vars supplied
  # inline, so it stays green even when the Dockerfile does not define them.
  # That is exactly how a broken image reached production — CI was green, the
  # deploy failed, and the site sat on the previous release.
  #
  # Deliberately passes NO build args, so the image is built purely from the
  # Dockerfile's own defaults. If a change makes the build depend on a value the
  # Dockerfile does not provide, this job fails here rather than at deploy time.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm vitest run
        env:
          SKIP_ENV_VALIDATION: "1"

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432
    env:
      DATABASE_URL: postgresql://test:testpassword@localhost:5432/aegis_integration
      SKIP_ENV_VALIDATION: "1"
      BETTER_AUTH_SECRET: ci-integration-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run integration tests
        run: pnpm test:integration

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          prisma: "false"

      # A hard gate: a high or critical advisory against a production
      # dependency fails CI. This was advisory-only while the backlog was
      # non-empty; #59 cleared every high/critical, so the gate now reflects a
      # standard the codebase actually meets. Restoring continue-on-error to
      # get a red build green again would silently reopen that backlog — fix
      # or override the advisory instead.
      - name: Run security audit
        run: pnpm audit --prod --audit-level=high

  # Blocking browser subset, and the only browser gate on a merge. The full
  # suite runs nightly and on demand from e2e.yml — it is slow and has known
  # flaky scenarios. Do not add continue-on-error here.
  e2e-smoke:
    uses: ./.github/workflows/e2e.yml
    with:
      smoke: true
