name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "next.config.*"
      - "playwright.config.*"
      - "Dockerfile"
      - ".dockerignore"
      - "docs/**"
      - "scripts/generate-reference-docs.mjs"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "next.config.*"
      - "playwright.config.*"
      - "Dockerfile"
      - ".dockerignore"
      - "docs/**"
      - "scripts/generate-reference-docs.mjs"
      - ".github/workflows/ci.yml"

# Prevent concurrent deployments on main, cancel stale PR runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Check generated reference docs are current
        run: pnpm docs:check

      - name: Run ESLint
        run: pnpm lint
        env:
          SKIP_ENV_VALIDATION: "1"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run TypeScript type check
        run: pnpm tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Cache Next.js build output
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Next.js application
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          BETTER_AUTH_SECRET: "ci-build-secret-0123456789abcdef0123456789abcdef"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

  # Builds the actual production image, the way Coolify does on every merge.
  #
  # The `build` job above is NOT a substitute: it runs `pnpm build` with the env
  # vars supplied inline, so it stays green even when the Dockerfile does not
  # define them. That is exactly how a broken image reached production — CI was
  # green, the deploy failed, and the site sat on the previous release.
  #
  # Deliberately passes NO build args, so the image is built purely from the
  # Dockerfile's own defaults. If a change makes the build depend on a value the
  # Dockerfile does not provide, this job fails here rather than at deploy time.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run unit tests
        run: pnpm vitest run
        env:
          SKIP_ENV_VALIDATION: "1"

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_integration
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:testpassword@localhost:5432/aegis_integration
      SKIP_ENV_VALIDATION: "1"
      BETTER_AUTH_SECRET: ci-integration-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run integration tests
        run: pnpm test:integration

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A hard gate: a high or critical advisory against a production
      # dependency fails CI. This was advisory-only while the backlog was
      # non-empty; #59 cleared every high/critical, so the gate now reflects a
      # standard the codebase actually meets. Restoring continue-on-error to
      # get a red build green again would silently reopen that backlog — fix
      # or override the advisory instead.
      - name: Run security audit
        run: pnpm audit --prod --audit-level=high

  # Blocking browser subset. Small, deterministic, and the only browser gate on
  # a merge — the full suite below stays advisory because it is slow and has
  # known flaky scenarios.
  e2e-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:testpassword@localhost:5432/aegis_test
      BETTER_AUTH_SECRET: e2e-test-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push database schema
        run: pnpm db:push

      # Rehearses the hand-applied production migration in its real position:
      # after the schema exists, before db:bootstrap, whose composite FKs
      # depend on the unique indexes this file creates. db:push has already
      # created everything here, so a green step also proves idempotency.
      - name: Apply hand-run schema migration
        run: pnpm db:apply prisma/migrations/20260904_f07_f15_schema_additions.sql

      - name: Apply non-Prisma database objects
        run: pnpm db:bootstrap

      - name: Verify required database objects
        run: pnpm db:verify

      - name: Seed database
        run: pnpm db:seed

      # seed:lifecycle resolves CRD-HLN examination nodes and their questions by
      # code; without these two it aborts with "examination node not found".
      # Order is fixed: nodes, then the questions that hang off them.
      - name: Seed RBIA housing examination tree
        run: pnpm seed:rbia-housing

      - name: Seed examination questions
        run: pnpm seed:exam-questions

      - name: Seed audit lifecycle fixtures
        run: pnpm seed:lifecycle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e:smoke

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 3

  # Full browser suite — advisory. Quarantine individual flaky scenarios with
  # test.skip and a reason; do not restore continue-on-error to e2e-smoke.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aegis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://test:testpassword@localhost:5432/aegis_test
      BETTER_AUTH_SECRET: e2e-test-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Push database schema
        run: pnpm db:push

      # Rehearses the hand-applied production migration in its real position:
      # after the schema exists, before db:bootstrap, whose composite FKs
      # depend on the unique indexes this file creates. db:push has already
      # created everything here, so a green step also proves idempotency.
      - name: Apply hand-run schema migration
        run: pnpm db:apply prisma/migrations/20260904_f07_f15_schema_additions.sql

      - name: Apply non-Prisma database objects
        run: pnpm db:bootstrap

      - name: Verify required database objects
        run: pnpm db:verify

      - name: Seed database
        run: pnpm db:seed

      # seed:lifecycle resolves CRD-HLN examination nodes and their questions by
      # code; without these two it aborts with "examination node not found".
      # Order is fixed: nodes, then the questions that hang off them.
      - name: Seed RBIA housing examination tree
        run: pnpm seed:rbia-housing

      - name: Seed examination questions
        run: pnpm seed:exam-questions

      - name: Seed audit lifecycle fixtures
        run: pnpm seed:lifecycle

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
