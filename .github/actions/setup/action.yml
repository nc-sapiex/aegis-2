name: Setup
description: pnpm, Node 22, frozen install, and (optionally) the Prisma client.

inputs:
  prisma:
    description: Run `prisma generate` after install.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      if: inputs.prisma == 'true'
      shell: bash
      run: pnpm prisma generate
